<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — ASHDRIFT</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111210;
      --text: #ecece7;
      --muted: #a6a99f;
      --line: #30332d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 42rem);
      border-top: 1px solid var(--line);
      padding-top: 2rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
    }

    a { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The requested page was not found.</p>
    <p><a href="/">Return to ASHDRIFT</a></p>
  </main>
</body>
</html>
