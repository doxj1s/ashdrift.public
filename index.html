<title>ASHDRIFT</title>
<style>
:root { color-scheme: dark; --bg:#0b0d0c; --fg:#d8ddd9; --muted:#7f8982; --line:#242a26; }

html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace; display:grid; place-items:center; }
main { width:min(90vw,720px); padding:3rem 2rem; }
.mark { letter-spacing:.22em; font-size:clamp(2rem,7vw,4.5rem); font-weight:600; margin:0; }
.rule { width:4rem; border:0; border-top:1px solid var(--line); margin:1.5rem 0; }
p { margin:0; color:var(--muted); font-size:.9rem; letter-spacing:.08em; }
</style>
</head>
<body>
<main>
